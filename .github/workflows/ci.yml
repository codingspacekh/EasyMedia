name: CI

# Runs on every push to dev and main. A pull request from dev to main shows the
# result of the run for its latest commit, so the tests are not run twice
# (macOS minutes count 10x on private repositories).
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-latest }
          - { name: macOS Apple Silicon, os: macos-latest }
          - { name: macOS Intel, os: macos-15-intel }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck

      - name: Cache bundled FFmpeg
        uses: actions/cache@v4
        with:
          path: resources/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ffmpeg-manifest.json') }}
      - name: Fetch bundled FFmpeg (checksums verified)
        run: npm run fetch:ffmpeg

      - name: All tests (unit, UI, integration with real FFmpeg, acceptance) with coverage gate
        run: npm run coverage

      - name: Production build
        run: npm run build
