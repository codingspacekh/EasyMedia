name: Release

# M12: pushing a version tag (vX.Y.Z, on the merge into main) makes a DRAFT GitHub Release and
# builds the Windows installer into it; the packaged app checks itself.
# M17a: the installers carry the update address (this repo's latest release), and latest.yml is
# added for the installed apps to find the next version. The two Mac installers are built on the
# maintainer's Mac, signed with their certificate so Macs can update by themselves:
# `npm run release:mac` adds them to the same draft. Publishing the draft releases it to every
# installed OneEditor.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Once, before the builds: GitHub allows several drafts for one tag, so if each build made its
  # own, there would be three drafts (the installers in one, the others empty).
  draft:
    name: Draft release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "OneEditor ${TAG#v}" \
            --notes "Installers for Windows (x64) and macOS (Apple chip: arm64, Intel: x64; added by npm run release:mac). How to install: docs/INSTALL.md."

  installers:
    name: ${{ matrix.name }}
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-latest }
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      ONEEDITOR_UPDATE_URL: https://github.com/${{ github.repository }}/releases/latest/download
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - name: The tag matches the version in package.json
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$TAG"
      - name: Download the Electron binary, up to 3 tries (the download sometimes fails)
        shell: bash
        run: for i in 1 2 3; do node node_modules/electron/install.js && exit 0; sleep 15; done; exit 1
      - run: npm run fetch:ffmpeg
      - name: Build the app, its licences, and the installers; the packaged app checks itself
        run: npm run dist

      - name: Attach the installers to the draft release
        shell: bash
        run: |
          shopt -s nullglob
          gh release upload "$TAG" --clobber release/*.exe release/*.zip release/*.blockmap release/latest.yml
