<section class="preview">
  <div class="preview-top">
    <span style="font-weight:600;font-size:12px;color:var(--tx-2);letter-spacing:.02em;text-transform:uppercase">Preview</span>
    <span class="spacer" style="flex:1"></span>
    <span class="chip" style="height:24px">Proxy · smooth</span>
    <span class="chip" style="height:24px">Safe area {{i:check:s14}}</span>
    <span class="btn sm">{{i:sparkle:s14}} Exact preview</span>
  </div>
  <div class="stage">
{{SCREEN|screen-default}}
  </div>
  <div class="transport">
    <span class="btn ghost icon">{{i:skipb}}</span>
    <span class="play">{{i:play:s20}}</span>
    <span class="btn ghost icon">{{i:skipf}}</span>
    <span class="tc">{{TC|tc-video}} <small>/ 00:40.70</small></span>
    <span class="spacer" style="flex:1"></span>
    <span class="btn ghost icon">{{i:loop}}</span>
    <span class="btn ghost icon">{{i:vol}}</span>
    <span class="btn sm">{{i:camera:s14}} Snapshot</span>
  </div>
</section>
