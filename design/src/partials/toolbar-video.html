<div class="toolbar">
  <div class="seg">
    <button class="on">{{i:film}} Video</button>
    <button>{{i:wave}} Audio</button>
    <button>{{i:book}} Learn</button>
  </div>
  <div class="vsep"></div>
  <div class="tools">
    <div class="tool">{{i:import}}Import</div>
    <div class="tool">{{i:title}}Title</div>
    <div class="tool">{{i:captions}}Caption</div>
    <div class="tool">{{i:credits}}Credits</div>
    <div class="tool">{{i:camera}}Snapshot</div>
    <div class="tool">{{i:split}}Split</div>
    <div class="tool">{{i:transition}}Transition</div>
    <div class="tool">{{i:music}}Add music</div>
  </div>
  <div class="spacer"></div>
  <span class="chip">{{i:aspect:s14}} <b>16:9</b> · 1920 × 1080 · 30 fps {{i:chev:s14}}</span>
  <div class="btn ghost icon">{{i:undo}}</div>
  <div class="btn ghost icon">{{i:redo}}</div>
  <div class="btn primary">{{i:export}} Export</div>
</div>
