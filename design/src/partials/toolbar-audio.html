<div class="toolbar">
  <div class="seg">
    <button>{{i:film}} Video</button>
    <button class="on">{{i:wave}} Audio</button>
    <button>{{i:book}} Learn</button>
  </div>
  <div class="vsep"></div>
  <div class="row" style="gap:5px">
    <span class="tbtn">{{i:play}}</span><span class="tbtn">{{i:pause}}</span><span class="tbtn">{{i:stop}}</span><span class="tbtn rec {{REC_ON}}">{{i:rec}}</span><span class="tbtn">{{i:loop}}</span>
  </div>
  <div class="vsep"></div>
  <div class="row" style="gap:5px"><span class="tbtn on" title="Selection tool">{{i:ibeam}}</span><span class="tbtn" title="Time shift tool">{{i:move}}</span></div>
  <div class="vsep"></div>
  <div class="row" style="gap:5px"><span class="tbtn" title="Cut">{{i:scissors}}</span><span class="tbtn" title="Copy">{{i:copy}}</span><span class="tbtn" title="Paste">{{i:paste}}</span><span class="tbtn" title="Trim to selection">{{i:trim}}</span><span class="tbtn" title="Insert silence">{{i:silence}}</span></div>
  <div class="vsep"></div>
  <div class="btn ghost icon">{{i:undo}}</div><div class="btn ghost icon">{{i:redo}}</div>
  <div class="spacer"></div>
  <div class="meter"><div></div><div></div></div>
  <div class="btn {{TRACKS_ON}}">{{i:sliders:s14}} Tracks {{i:chev:s14}}</div>
  <div class="btn {{EFFECT_ON}}">{{i:sparkle:s14}} Effect {{i:chev:s14}}</div>
  <div class="btn icon" title="Import audio">{{i:import}}</div>
  <div class="btn primary">{{i:export}} Export</div>
</div>
